name: Fetch team data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run fetch-data.js
        env:
          SPOND_USERNAME: ${{ secrets.SPOND_USERNAME }}
          SPOND_PASSWORD: ${{ secrets.SPOND_PASSWORD }}
          SPLITSER_EMAIL: ${{ secrets.SPLITSER_EMAIL }}
          SPLITSER_PASSWORD: ${{ secrets.SPLITSER_PASSWORD }}
        # Partial failures (e.g. one flaky endpoint) shouldn't block committing
        # whichever data files did update successfully — see fetch-data.js.
        run: node scripts/fetch-data.js || echo "::warning::fetch-data.js reported partial failures, see log above"

      - name: Commit updated data files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git commit -m "Update team data" || echo "No changes to commit"
          git push
